<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>oriz.games — Free Browser Games</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="Free browser games — 2048, Minesweeper, Sudoku, Snake, Tetris, Wordle and more. No install, no login.">
<style>
header {
  text-align: center;
  padding: 48px 20px 32px;
}
header h1 {
  font-size: clamp(28px, 5vw, 48px);
  font-weight: 800;
  letter-spacing: -1px;
  color: var(--text);
}
header h1 span { color: var(--accent); }
header p {
  margin-top: 8px;
  color: var(--muted);
  font-size: 16px;
}

.search-bar {
  display: flex;
  justify-content: center;
  padding: 0 20px 24px;
}
.search-bar input {
  width: 100%;
  max-width: 400px;
  padding: 10px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
}
.search-bar input:focus { border-color: var(--accent); }

.filters {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 0 20px 32px;
}
.filter-btn {
  padding: 7px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  background: var(--card);
  color: var(--muted);
  border: 1px solid var(--border);
  transition: all 0.15s;
}
.filter-btn.active, .filter-btn:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px 60px;
}
@media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 500px) { .grid { grid-template-columns: 1fr; } }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 20px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  transition: border-color 0.15s, transform 0.15s;
}
.card:hover {
  border-color: var(--accent);
  transform: translateY(-3px);
}
.card-emoji { font-size: 48px; line-height: 1; }
.card-name {
  font-size: 17px;
  font-weight: 700;
  text-align: center;
}
.badge {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.badge-puzzle  { background: #1e3a5f; color: #60a5fa; }
.badge-arcade  { background: #3b1f2b; color: #f472b6; }
.badge-word    { background: #1e3a2b; color: #4ade80; }
.badge-board   { background: #2d1f3b; color: #c084fc; }

.card a.btn { width: 100%; text-align: center; margin-top: 4px; }

footer {
  text-align: center;
  padding: 20px;
  color: var(--muted);
  font-size: 13px;
  border-top: 1px solid var(--border);
}
</style>
</head>
<body>
<header>
  <h1>oriz<span>.games</span></h1>
  <p>Free browser games — no install, no login</p>
</header>

<div class="search-bar">
  <input type="search" id="search" placeholder="Search games..." aria-label="Search games">
</div>

<div class="filters">
  <button class="filter-btn active" data-cat="all">All</button>
  <button class="filter-btn" data-cat="puzzle">Puzzles</button>
  <button class="filter-btn" data-cat="arcade">Arcade</button>
  <button class="filter-btn" data-cat="word">Word</button>
  <button class="filter-btn" data-cat="board">Board</button>
</div>

<main class="grid" id="grid"></main>

<footer>
  <p>oriz.games &mdash; <a href="https://oriz.in">oriz.in</a></p>
</footer>

<script>
const GAMES = [
  { name: '2048', cat: 'puzzle', emoji: '🔢', file: 'games/2048.html', desc: 'Slide tiles to reach 2048' },
  { name: 'Minesweeper', cat: 'puzzle', emoji: '💣', file: 'games/minesweeper.html', desc: 'Classic mine sweeping' },
  { name: 'Sudoku', cat: 'puzzle', emoji: '🔲', file: 'games/sudoku.html', desc: 'Fill the 9×9 grid' },
  { name: 'Sliding Puzzle', cat: 'puzzle', emoji: '🧩', file: 'games/sliding-puzzle.html', desc: '3×3 and 4×4 tile puzzles' },
  { name: 'Snake', cat: 'arcade', emoji: '🐍', file: 'games/snake.html', desc: 'Grow without hitting walls' },
  { name: 'Tetris', cat: 'arcade', emoji: '🟦', file: 'games/tetris.html', desc: 'Clear lines with falling pieces' },
  { name: 'Flappy Bird', cat: 'arcade', emoji: '🐦', file: 'games/flappy-bird.html', desc: 'Tap to fly through pipes' },
  { name: 'Breakout', cat: 'arcade', emoji: '🧱', file: 'games/breakout.html', desc: 'Break all the bricks' },
  { name: 'Wordle', cat: 'word', emoji: '🟩', file: 'games/wordle.html', desc: 'Guess the 5-letter word' },
  { name: 'Trivia', cat: 'word', emoji: '❓', file: 'games/trivia.html', desc: '10-question general knowledge quiz' },
  { name: 'Hangman', cat: 'word', emoji: '🎯', file: 'games/hangman.html', desc: 'Guess the word letter by letter' },
  { name: 'Tic-Tac-Toe', cat: 'board', emoji: '⭕', file: 'games/tic-tac-toe.html', desc: 'Classic 3-in-a-row' },
  { name: 'Connect Four', cat: 'board', emoji: '🔴', file: 'games/connect-four.html', desc: 'Drop discs to connect four' },
  { name: 'Chess', cat: 'board', emoji: '♟', file: 'games/chess.html', desc: 'Full chess with AI opponent' },
];

const BADGE_CLASS = { puzzle: 'badge-puzzle', arcade: 'badge-arcade', word: 'badge-word', board: 'badge-board' };

let activeCat = 'all';
let searchQ = '';

function render() {
  const grid = document.getElementById('grid');
  const filtered = GAMES.filter(g =>
    (activeCat === 'all' || g.cat === activeCat) &&
    (g.name.toLowerCase().includes(searchQ) || g.desc.toLowerCase().includes(searchQ))
  );
  grid.innerHTML = filtered.map(g => `
    <div class="card" data-cat="${g.cat}">
      <div class="card-emoji">${g.emoji}</div>
      <div class="card-name">${g.name}</div>
      <span class="badge ${BADGE_CLASS[g.cat]}">${g.cat}</span>
      <p style="font-size:13px;color:var(--muted);text-align:center">${g.desc}</p>
      <a href="${g.file}" class="btn">Play</a>
    </div>
  `).join('');
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.filter-btn.active').classList.remove('active');
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    render();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value.toLowerCase();
  render();
});

render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
