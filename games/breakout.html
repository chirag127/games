<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout — oriz.games</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:500px;padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center}
a.back{color:var(--muted);font-size:14px;text-decoration:none}a.back:hover{color:var(--text)}
h1{font-size:24px;font-weight:800}
canvas{border:2px solid var(--border);border-radius:10px;display:block;margin-top:12px;touch-action:none}
#overlay{position:fixed;inset:0;background:rgba(15,23,42,.88);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:10}
#overlay h2{font-size:36px}
#overlay p{color:var(--muted)}
button{cursor:pointer;border:none;font-family:inherit;background:var(--accent);color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600}
.hint{color:var(--muted);font-size:13px;margin-top:6px;text-align:center}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&#8592; Back</a>
  <h1>Breakout</h1>
</header>
<canvas id="c" width="400" height="500"></canvas>
<div class="hint">Mouse / touch to move paddle</div>
<div id="overlay">
  <h2 id="ovT">Breakout</h2>
  <p id="ovS">Move mouse or touch to control paddle</p>
  <button onclick="startGame()">Play</button>
</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=400,H=500;
const ROWS=6,COLS=10,BRICK_W=36,BRICK_H=16,BRICK_PAD=4,BRICK_TOP=60;
const COLORS=['#f87171','#fb923c','#facc15','#4ade80','#60a5fa','#818cf8'];
let paddle,ball,bricks,score,lives,best,raf,running;

function startGame(){
  best=+localStorage.getItem('bo-best')||0;
  paddle={x:W/2-40,y:H-24,w:80,h=12:12};
  ball={x:W/2,y:H-50,vx:3,vy:-4,r:7};
  bricks=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    bricks.push({x:c*(BRICK_W+BRICK_PAD)+14,y:r*(BRICK_H+BRICK_PAD)+BRICK_TOP,alive:true,color:COLORS[r]});
  }
  score=0;lives=3;running=true;
  document.getElementById('overlay').style.display='none';
  if(raf)cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

function loop(){
  if(!running)return;
  update();draw();
  raf=requestAnimationFrame(loop);
}

function update(){
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.x-ball.r<0){ball.x=ball.r;ball.vx*=-1;}
  if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx*=-1;}
  if(ball.y-ball.r<0){ball.y=ball.r;ball.vy*=-1;}
  if(ball.y+ball.r>H){lives--;if(lives<=0){end(false);return;}ball.x=W/2;ball.y=H-50;ball.vx=3;ball.vy=-4;}
  // paddle
  if(ball.y+ball.r>=paddle.y&&ball.y+ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){
    const rel=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
    const angle=rel*1.2;
    const speed=Math.sqrt(ball.vx**2+ball.vy**2);
    ball.vx=speed*Math.sin(angle);
    ball.vy=-speed*Math.abs(Math.cos(angle));
    ball.y=paddle.y-ball.r-1;
  }
  // bricks
  for(const b of bricks){
    if(!b.alive)continue;
    if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+BRICK_W&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+BRICK_H){
      b.alive=false;score+=10;
      const overlapX=Math.min(ball.x+ball.r-b.x,b.x+BRICK_W-(ball.x-ball.r));
      const overlapY=Math.min(ball.y+ball.r-b.y,b.y+BRICK_H-(ball.y-ball.r));
      if(overlapX<overlapY)ball.vx*=-1;else ball.vy*=-1;
      break;
    }
  }
  if(bricks.every(b=>!b.alive)){end(true);}
}

function draw(){
  ctx.fillStyle='#0f172a';ctx.fillRect(0,0,W,H);
  bricks.forEach(b=>{
    if(!b.alive)return;
    ctx.fillStyle=b.color;ctx.beginPath();ctx.roundRect(b.x,b.y,BRICK_W,BRICK_H,3);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(b.x+2,b.y+2,BRICK_W-4,4);
  });
  // paddle
  ctx.fillStyle='#6366f1';ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,6);ctx.fill();
  // ball
  ctx.fillStyle='#e2e8f0';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  // hud
  ctx.fillStyle='#e2e8f0';ctx.font='bold 16px sans-serif';ctx.textAlign='left';
  ctx.fillText('Score: '+score,12,24);
  ctx.fillText('Best: '+Math.max(best,score),12,44);
  ctx.textAlign='right';
  ctx.fillText('Lives: '+'♥'.repeat(lives),W-12,24);
}

function end(win){
  running=false;
  if(score>best){best=score;localStorage.setItem('bo-best',score);}
  document.getElementById('ovT').textContent=win?'You Win!':'Game Over';
  document.getElementById('ovS').textContent='Score: '+score;
  document.getElementById('overlay').style.display='flex';
}

canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(W/rect.width);
  paddle.x=Math.max(0,Math.min(W-paddle.w,mx-paddle.w/2));
});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const mx=(e.touches[0].clientX-rect.left)*(W/rect.width);
  paddle.x=Math.max(0,Math.min(W-paddle.w,mx-paddle.w/2));
},{passive:false});
</script>
</body>
</html>
