<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle — oriz.games</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1;--green:#4ade80;--yellow:#facc15;--gray:#475569}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:500px;padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center}
a.back{color:var(--muted);font-size:14px;text-decoration:none}a.back:hover{color:var(--text)}
h1{font-size:24px;font-weight:800}
button{cursor:pointer;border:none;font-family:inherit}
#grid{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;padding:20px;width:min(90vw,310px)}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{aspect-ratio:1;border:2px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,6vw,26px);font-weight:800;text-transform:uppercase;transition:background .3s,border-color .3s;background:var(--card)}
.tile.filled{border-color:#64748b;animation:pop .1s ease}
.tile.correct{background:var(--green);border-color:var(--green);color:#0f172a}
.tile.present{background:var(--yellow);border-color:var(--yellow);color:#0f172a}
.tile.absent{background:var(--gray);border-color:var(--gray)}
.tile.shake{animation:shake .3s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#keyboard{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:20px}
.kb-row{display:flex;gap:5px}
.kb-key{height:58px;min-width:36px;border-radius:6px;font-size:13px;font-weight:700;background:#334155;color:var(--text);padding:0 8px;text-transform:uppercase;transition:background .2s}
.kb-key.wide{min-width:54px;font-size:11px}
.kb-key.correct{background:var(--green);color:#0f172a}
.kb-key.present{background:var(--yellow);color:#0f172a}
.kb-key.absent{background:#1e293b;color:var(--muted)}
#msg{height:28px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#facc15}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&#8592; Back</a>
  <h1>Wordle</h1>
  <button onclick="newGame()" style="background:var(--accent);color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600">New</button>
</header>
<div id="msg"></div>
<div id="grid"></div>
<div id="keyboard"></div>

<script>
const WORDS=['about','above','abuse','actor','acute','admit','adopt','adult','after','again','agent','agree','ahead','alarm','album','alert','alike','alive','alley','allow','alone','along','alter','angel','anger','angle','angry','anime','ankle','annex','antic','apple','apply','arena','argue','arise','array','arrow','asset','atlas','attic','audio','audit','avoid','awake','award','aware','awful','basic','basis','beach','beard','beast','began','begin','being','below','bench','birth','black','blade','blame','bland','blank','blast','blaze','bleed','blend','bless','blind','block','blood','blown','blues','board','bonus','boost','booth','bound','brain','brand','brave','bread','break','breed','bribe','bride','brief','bring','brink','broad','broke','brown','brown','brush','buddy','build','built','burst','buyer','cabin','cable','camel','candy','cargo','carry','catch','cause','cease','chain','chair','chaos','charm','chase','cheap','check','cheek','cheer','chest','chief','child','china','choir','chunk','civil','claim','class','clean','clear','clerk','click','cliff','climb','cling','clock','close','cloud','coach','coast','cobra','comet','comic','comma','coral','could','count','court','cover','craft','crash','crawl','crazy','cream','creek','crime','crisp','crypt','cubic','curve','cycle','daily','dance','death','debut','decoy','delay','delta','demon','depot','depth','derby','devil','digit','dirty','disco','ditch','diver','dizzy','dodge','doubt','dough','dowry','draft','drain','drake','drama','drank','dread','dream','dress','drink','drive','drone','drove','drown','drugs','drums','drunk','dryer','duchy','eagle','early','earth','eight','eject','elect','elite','empty','ended','enemy','enjoy','enter','equal','error','essay','event','evoke','exact','excel','exist','extra','fable','faint','faith','false','fault','feast','fence','fever','fiber','field','fifth','fifty','fight','filed','final','first','fixed','flame','flash','flask','flesh','fleet','flick','flies','flock','flood','floor','floss','flour','fluky','flush','focal','focus','foggy','force','forge','forth','found','frame','franc','freed','fresh','front','frost','fruit','fully','funny','ghost','giant','given','gland','glass','globe','gloom','glory','glove','glyph','going','grace','grade','grain','grand','grant','graph','grasp','grass','grave','great','greed','green','grief','grind','groan','gross','group','grove','grown','guard','guide','guild','guilt','guise','gusto','gypsy','habit','happy','harsh','haunt','haven','heart','heavy','hedge','heist','hello','herbs','hexed','hinge','hippo','hobby','holly','honey','honor','horse','hotel','house','hover','human','humid','humor','hurry','hyena','ideal','image','inbox','index','indie','inlet','inner','input','inter','intro','inuit','invent','issue','ivory','japan','jewel','joint','joker','joust','judge','juice','juicy','jumbo','karma','kayak','knife','knock','koala','label','large','laser','later','laugh','layer','leads','lease','legal','lemon','level','light','limit','linen','liner','lingo','lipid','liver','lodge','login','loner','loose','lunar','lying','lyric','magic','magma','maker','manor','maple','marry','marsh','match','maven','medal','media','mercy','merge','metal','minor','minus','mirth','moist','money','month','moral','motor','mount','mouse','mouth','moved','movie','muddy','music','nasal','naval','nerve','never','night','noble','noise','north','noted','novel','nurse','oasis','offer','olive','onset','opera','orbit','order','organ','other','outer','oxide','ozone','padre','paint','panic','paper','patch','pause','peach','pearl','pedal','penny','perky','phase','phone','photo','piano','pilot','pilot','pinch','pixel','pizza','place','plain','plane','plant','plate','plaza','plead','pluck','plume','plump','plunk','plush','point','polar','posit','pouch','pound','power','press','price','pride','prism','prize','probe','prone','prove','proxy','psalm','pulse','punch','pupil','puffy','queen','query','quest','queue','quick','quiet','quilt','quota','quote','rabbi','radar','radio','ramen','range','rapid','ratio','reach','realm','rebel','refer','reign','relay','repay','repel','reply','resin','rigid','risky','rival','river','robin','robot','rocky','rouge','rough','rough','round','route','royal','rugby','rugged','ruler','rumor','rural','rusty','salad','sandy','sauce','scale','scare','scene','scope','score','scout','screw','seize','serve','seven','shade','shake','shall','shame','shape','share','shark','sharp','shave','shift','shine','shirt','shock','shore','shown','sight','sigma','silly','since','sixth','sixty','skate','skill','skull','slang','slant','slave','sleep','slide','slope','smart','smell','smile','smirk','smoke','snack','snail','snake','snare','sneak','sneer','sniff','solar','solid','solve','sonic','sorry','south','space','speak','speed','spend','spice','spike','spine','spite','split','spoke','spook','spoon','spore','spray','squad','stain','stake','stale','stamp','stand','stark','start','state','steam','steel','steep','steer','stern','stick','still','sting','stock','stone','stood','storm','story','stout','strap','straw','stray','strip','stuck','study','stuff','stunt','style','sugar','suite','sunny','super','swamp','swear','sweep','sweet','swept','swift','swirl','swoop','sword','sworn','syrup','table','taken','talon','tangy','taunt','taste','teach','tense','terra','thank','theme','there','these','thick','thing','think','third','thorn','those','three','threw','throw','thumb','tiara','tidal','tiger','tight','timer','tired','title','toast','today','token','topic','total','touch','tough','towel','tower','track','trade','trail','train','trait','tramp','trap','trash','trawl','trend','trial','tribe','trick','tried','troop','trust','tryst','tubal','tulip','tuned','tunic','twist','tying','ultra','unify','union','unite','until','upper','upset','usage','usefulness','usual','utter','valid','valor','value','vault','venom','verge','verse','vicar','video','vigor','viral','virus','visit','visor','vista','vital','vivid','vocab','vocal','voice','voter','vow','wader','wafer','waltz','waste','watch','water','weave','wedge','weigh','weird','whack','whale','wheat','wheel','where','which','while','white','whole','whose','wider','witch','woman','women','world','worry','worse','worst','worth','would','wrath','write','yacht','young','yours','youth','zonal','zebra'].map(w=>w.toLowerCase()).filter(w=>w.length===5);

let target,guesses,current,gameOver,keyColors;

function newGame(){
  target=WORDS[Math.floor(Math.random()*WORDS.length)];
  guesses=[];current='';gameOver=false;keyColors={};
  document.getElementById('msg').textContent='';
  buildGrid();buildKeyboard();
}

function buildGrid(){
  const g=document.getElementById('grid');
  g.innerHTML='';
  for(let r=0;r<6;r++){
    const row=document.createElement('div');row.className='row';row.id='row'+r;
    for(let c=0;c<5;c++){
      const t=document.createElement('div');t.className='tile';t.id=`t${r}${c}`;
      row.appendChild(t);
    }
    g.appendChild(row);
  }
}

function buildKeyboard(){
  const ROWS=['qwertyuiop','asdfghjkl','⌫zxcvbnm↵'];
  const kb=document.getElementById('keyboard');kb.innerHTML='';
  ROWS.forEach(row=>{
    const div=document.createElement('div');div.className='kb-row';
    [...row].forEach(k=>{
      const b=document.createElement('button');b.className='kb-key';
      b.textContent=k;b.dataset.key=k;
      if(k==='⌫'||k==='↵')b.classList.add('wide');
      b.addEventListener('click',()=>handleKey(k));
      div.appendChild(b);
    });
    kb.appendChild(div);
  });
}

function handleKey(k){
  if(gameOver)return;
  if(k==='⌫'||k==='Backspace'){current=current.slice(0,-1);}
  else if(k==='↵'||k==='Enter'){submit();}
  else if(/^[a-z]$/i.test(k)&&current.length<5){current+=k.toLowerCase();}
  updateRow();
}

function updateRow(){
  const r=guesses.length;
  for(let c=0;c<5;c++){
    const t=document.getElementById(`t${r}${c}`);
    t.textContent=current[c]||'';
    if(current[c])t.classList.add('filled');else t.classList.remove('filled');
  }
}

function submit(){
  if(current.length!==5){shake();msg('5 letters needed');return;}
  if(!WORDS.includes(current)){shake();msg('Not in word list');return;}
  const result=score(current);
  const r=guesses.length;
  for(let c=0;c<5;c++){
    const t=document.getElementById(`t${r}${c}`);
    t.textContent=current[c];
    setTimeout(()=>t.classList.add(result[c]),c*100+200);
    const prev=keyColors[current[c]];
    if(result[c]==='correct'||(!prev&&result[c]==='present')||(!prev))
      keyColors[current[c]]=result[c]==='correct'?'correct':result[c]==='present'?'present':prev||'absent';
  }
  setTimeout(()=>updateKeyboard(),800);
  guesses.push(current);
  if(current===target){setTimeout(()=>endGame(true),700);}
  else if(guesses.length===6){setTimeout(()=>endGame(false),700);}
  current='';
}

function score(guess){
  const res=Array(5).fill('absent');
  const tArr=[...target];
  // first pass: correct
  for(let i=0;i<5;i++)if(guess[i]===target[i]){res[i]='correct';tArr[i]=null;}
  // second pass: present
  for(let i=0;i<5;i++){
    if(res[i]==='correct')continue;
    const idx=tArr.indexOf(guess[i]);
    if(idx>=0){res[i]='present';tArr[idx]=null;}
  }
  return res;
}

function updateKeyboard(){
  document.querySelectorAll('.kb-key').forEach(b=>{
    const k=b.dataset.key;
    if(keyColors[k])b.className='kb-key'+(b.classList.contains('wide')?' wide':'')+' '+keyColors[k];
  });
}

function shake(){const row=document.getElementById('row'+guesses.length);row.querySelectorAll('.tile').forEach(t=>{t.classList.add('shake');setTimeout(()=>t.classList.remove('shake'),400);});}
function msg(t){const m=document.getElementById('msg');m.textContent=t;setTimeout(()=>m.textContent='',1800);}

function endGame(win){
  gameOver=true;
  setTimeout(()=>{
    document.getElementById('msg').textContent=win?'Brilliant!':'Answer: '+target.toUpperCase();
  },win?100:300);
}

document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.altKey||e.metaKey)return;
  handleKey(e.key==='Backspace'?'⌫':e.key==='Enter'?'↵':e.key);
});

newGame();
</script>
</body>
</html>
