<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess — oriz.games</title>
<link rel="stylesheet"
  href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
  crossorigin="anonymous">
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:560px;padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center}
a.back{color:var(--muted);font-size:14px;text-decoration:none}a.back:hover{color:var(--text)}
h1{font-size:24px;font-weight:800}
button{cursor:pointer;border:none;font-family:inherit}
.wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
#board{width:min(90vw,480px)!important}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--accent);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600}
.btn:hover{opacity:.85}
.btn-outline{background:var(--card);color:var(--muted);border:1px solid var(--border);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600}
.btn-outline:hover{border-color:var(--accent);color:var(--text)}
#status{font-size:15px;font-weight:600;color:#facc15;text-align:center;min-height:24px}
#pgn{font-size:12px;color:var(--muted);max-width:480px;word-break:break-all;text-align:center;min-height:20px}
.mode-bar{display:flex;gap:8px;justify-content:center}
.m-btn{background:var(--card);color:var(--muted);border:1px solid var(--border);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;transition:all .15s}
.m-btn.active,.m-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Override chessboard light/dark squares to match theme */
.white-1e1d7{background:#e2e8f0!important}
.black-3c85d{background:#334155!important}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&#8592; Back</a>
  <h1>Chess</h1>
</header>
<div class="wrap">
  <div class="mode-bar">
    <button class="m-btn active" data-m="ai">vs AI</button>
    <button class="m-btn" data-m="2p">2 Players</button>
  </div>
  <div id="status">White to move</div>
  <div id="board"></div>
  <div class="toolbar">
    <button class="btn" id="newBtn">New Game</button>
    <button class="btn-outline" id="undoBtn">Undo</button>
    <button class="btn-outline" id="flipBtn">Flip</button>
  </div>
  <div id="pgn"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/chess.js@0.13.4/chess.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js" crossorigin="anonymous"></script>
<script>
let chess=new Chess(),board,mode='ai',orientation='white';

function newGame(){
  chess=new Chess();
  board.position('start');
  updateStatus();
}

function updateStatus(){
  let s='';
  if(chess.in_checkmate())s=(chess.turn()==='w'?'Black':'White')+' wins by checkmate!';
  else if(chess.in_draw())s='Draw!';
  else{s=(chess.turn()==='w'?'White':'Black')+' to move';if(chess.in_check())s+=' (in check)';}
  document.getElementById('status').textContent=s;
  document.getElementById('pgn').textContent=chess.pgn()||'';
}

function aiMove(){
  if(chess.game_over())return;
  const moves=chess.moves();
  if(!moves.length)return;
  // simple: prefer checks, captures, else random
  const checks=moves.filter(m=>m.includes('+'));
  const captures=moves.filter(m=>m.includes('x'));
  const pick=checks.length?checks:captures.length?captures:moves;
  chess.move(pick[Math.floor(Math.random()*pick.length)]);
  board.position(chess.fen());
  updateStatus();
}

const cfg={
  draggable:true,
  position:'start',
  onDragStart:(source,piece)=>{
    if(chess.game_over())return false;
    if(mode==='ai'&&chess.turn()==='b')return false;
    if(chess.turn()==='w'&&piece.startsWith('b'))return false;
    if(chess.turn()==='b'&&piece.startsWith('w'))return false;
    return true;
  },
  onDrop:(source,target)=>{
    const move=chess.move({from:source,to:target,promotion:'q'});
    if(!move){return'snapback';}
    updateStatus();
    if(mode==='ai'&&!chess.game_over())setTimeout(aiMove,350);
  },
  onSnapEnd:()=>{board.position(chess.fen());},
};

board=Chessboard('board',cfg);
$(window).resize(()=>board.resize());

document.getElementById('newBtn').addEventListener('click',newGame);
document.getElementById('undoBtn').addEventListener('click',()=>{
  chess.undo();if(mode==='ai')chess.undo();
  board.position(chess.fen());updateStatus();
});
document.getElementById('flipBtn').addEventListener('click',()=>board.flip());

document.querySelectorAll('.m-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelector('.m-btn.active').classList.remove('active');
    b.classList.add('active');mode=b.dataset.m;newGame();
  });
});
</script>
</body>
</html>
