<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird — oriz.games</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:500px;padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center}
a.back{color:var(--muted);font-size:14px;text-decoration:none}a.back:hover{color:var(--text)}
h1{font-size:24px;font-weight:800}
canvas{border:2px solid var(--border);border-radius:10px;display:block;margin-top:12px;touch-action:none}
#overlay{position:fixed;inset:0;background:rgba(15,23,42,.88);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:10}
#overlay h2{font-size:36px}
#overlay p{color:var(--muted)}
button{cursor:pointer;border:none;font-family:inherit;background:var(--accent);color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&#8592; Back</a>
  <h1>Flappy Bird</h1>
</header>
<canvas id="c" width="320" height="480"></canvas>
<div id="overlay">
  <h2 id="ovT">Flappy Bird</h2>
  <p id="ovS">Tap / Space to flap</p>
  <button onclick="startGame()">Play</button>
</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=320,H=480,GAP=130,PIPE_W=52,SPEED=2.5,GRAV=0.35,FLAP=-7;
let bird,pipes,score,best=+localStorage.getItem('fb-best')||0,raf,running,frameCount;

function startGame(){
  bird={x:80,y:H/2,vy:0,r:14};
  pipes=[];score=0;frameCount=0;running=true;
  document.getElementById('overlay').style.display='none';
  if(raf)cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

function addPipe(){
  const top=60+Math.random()*(H-GAP-120);
  pipes.push({x:W,top,scored:false});
}

function loop(){
  if(!running)return;
  frameCount++;
  if(frameCount%90===0||frameCount===1)addPipe();
  bird.vy+=GRAV;bird.y+=bird.vy;
  pipes.forEach(p=>p.x-=SPEED);
  pipes=pipes.filter(p=>p.x>-PIPE_W);
  for(const p of pipes){
    if(!p.scored&&p.x+PIPE_W<bird.x){p.scored=true;score++;if(score>best){best=score;localStorage.setItem('fb-best',best);}}
    if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+PIPE_W){
      if(bird.y-bird.r<p.top||bird.y+bird.r>p.top+GAP){end();return;}
    }
  }
  if(bird.y+bird.r>H||bird.y-bird.r<0){end();return;}
  draw();
  raf=requestAnimationFrame(loop);
}

function draw(){
  // sky gradient
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1e3a5f');sky.addColorStop(1,'#0f172a');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // ground
  ctx.fillStyle='#166534';ctx.fillRect(0,H-30,W,30);
  ctx.fillStyle='#14532d';ctx.fillRect(0,H-34,W,4);
  // pipes
  pipes.forEach(p=>{
    // pipe cap
    ctx.fillStyle='#16a34a';
    ctx.fillRect(p.x-2,0,PIPE_W+4,p.top-10);
    ctx.fillRect(p.x-6,p.top-10,PIPE_W+12,12);
    ctx.fillRect(p.x-2,p.top+GAP+10,PIPE_W+4,H);
    ctx.fillRect(p.x-6,p.top+GAP,PIPE_W+12,12);
    ctx.fillStyle='#15803d';
    ctx.fillRect(p.x,0,PIPE_W,p.top-10);
    ctx.fillRect(p.x,p.top+GAP+10,PIPE_W,H);
  });
  // bird body
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.min(Math.PI/4,bird.vy*0.04));
  ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(0,0,bird.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(bird.r-4,-4,bird.r-6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bird.r-2,-5,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0f172a';ctx.beginPath();ctx.arc(bird.r,- 5,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f97316';ctx.beginPath();ctx.moveTo(bird.r+2,2);ctx.lineTo(bird.r+10,0);ctx.lineTo(bird.r+2,4);ctx.fill();
  ctx.restore();
  // score
  ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.textAlign='center';
  ctx.fillText(score,W/2,50);
  ctx.font='14px sans-serif';ctx.fillStyle='var(--muted)';
  ctx.fillText('Best: '+best,W/2,72);
}

function end(){
  running=false;
  document.getElementById('ovT').textContent='Game Over';
  document.getElementById('ovS').textContent=`Score: ${score} | Best: ${best}`;
  document.getElementById('overlay').style.display='flex';
}

function flap(){if(running){bird.vy=FLAP;}}
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap();}});
canvas.addEventListener('click',flap);
canvas.addEventListener('touchstart',e=>{e.preventDefault();flap();},{passive:false});
</script>
</body>
</html>
