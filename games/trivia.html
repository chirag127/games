<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia — oriz.games</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1;--green:#4ade80;--red:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:640px;padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center}
a.back{color:var(--muted);font-size:14px;text-decoration:none}a.back:hover{color:var(--text)}
h1{font-size:24px;font-weight:800}
button{cursor:pointer;border:none;font-family:inherit}
.wrap{width:min(96vw,620px);padding:20px}
.progress{height:4px;background:var(--border);border-radius:2px;margin-bottom:20px}
.progress-bar{height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
.q-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:12px}
.q-text{font-size:clamp(16px,3vw,20px);font-weight:600;line-height:1.5;margin-bottom:20px;min-height:60px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.options{grid-template-columns:1fr}}
.opt{background:var(--card);border:2px solid var(--border);border-radius:10px;padding:14px 16px;font-size:14px;font-weight:500;color:var(--text);text-align:left;transition:all .15s;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent);background:#1e3a5f}
.opt.correct{border-color:var(--green);background:#14532d;color:var(--green)}
.opt.wrong{border-color:var(--red);background:#7f1d1d;color:var(--red)}
.opt:disabled{cursor:default}
.next-btn{background:var(--accent);color:#fff;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:600;margin-top:16px}
.next-btn:hover{opacity:.85}
.result-card{text-align:center;padding:40px 20px}
.result-card h2{font-size:36px;margin-bottom:8px}
.result-card .sc{font-size:64px;font-weight:800;color:var(--accent);line-height:1}
.result-card p{color:var(--muted);margin:8px 0 24px}
.play-btn{background:var(--accent);color:#fff;padding:12px 28px;border-radius:8px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&#8592; Back</a>
  <h1>Trivia</h1>
</header>
<div class="wrap" id="wrap"></div>

<script>
const QUESTIONS=[
  {q:"What is the capital of Australia?",opts:["Sydney","Melbourne","Canberra","Brisbane"],a:2},
  {q:"How many sides does a hexagon have?",opts:["5","6","7","8"],a:1},
  {q:"Who painted the Mona Lisa?",opts:["Michelangelo","Raphael","Leonardo da Vinci","Donatello"],a:2},
  {q:"What is the chemical symbol for gold?",opts:["Ag","Fe","Au","Hg"],a:2},
  {q:"Which planet is known as the Red Planet?",opts:["Venus","Mars","Jupiter","Saturn"],a:1},
  {q:"What year did World War II end?",opts:["1943","1944","1945","1946"],a:2},
  {q:"How many bones are in the adult human body?",opts:["196","206","216","226"],a:1},
  {q:"What is the longest river in the world?",opts:["Amazon","Nile","Yangtze","Mississippi"],a:1},
  {q:"Which element has the atomic number 1?",opts:["Helium","Oxygen","Hydrogen","Carbon"],a:2},
  {q:"Who wrote 'Romeo and Juliet'?",opts:["Charles Dickens","Jane Austen","William Shakespeare","Mark Twain"],a:2},
  {q:"What is the largest ocean on Earth?",opts:["Atlantic","Indian","Arctic","Pacific"],a:3},
  {q:"In what year was the first iPhone released?",opts:["2005","2006","2007","2008"],a:2},
  {q:"What is the speed of light (approx)?",opts:["200,000 km/s","300,000 km/s","400,000 km/s","150,000 km/s"],a:1},
  {q:"Which country invented paper?",opts:["Japan","India","Egypt","China"],a:3},
  {q:"What is the powerhouse of the cell?",opts:["Nucleus","Ribosome","Mitochondria","Golgi apparatus"],a:2},
  {q:"How many continents are on Earth?",opts:["5","6","7","8"],a:2},
  {q:"What is the smallest prime number?",opts:["0","1","2","3"],a:2},
  {q:"Which gas do plants primarily absorb?",opts:["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"],a:2},
  {q:"Who was the first person to walk on the Moon?",opts:["Buzz Aldrin","Yuri Gagarin","Neil Armstrong","John Glenn"],a:2},
  {q:"What is the hardest natural substance on Earth?",opts:["Gold","Iron","Diamond","Quartz"],a:2},
];

let pool,idx,score,answered,total=10;

function shuffle(a){return a.sort(()=>Math.random()-.5);}

function startGame(){
  pool=shuffle([...QUESTIONS]).slice(0,total);
  idx=0;score=0;
  showQuestion();
}

function showQuestion(){
  const wrap=document.getElementById('wrap');
  const q=pool[idx];
  const pct=((idx)/total*100).toFixed(0);
  wrap.innerHTML=`
    <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="q-meta"><span>Question ${idx+1} of ${total}</span><span>Score: ${score}</span></div>
    <div class="q-text">${q.q}</div>
    <div class="options">
      ${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}
    </div>
    <button class="next-btn" id="nextBtn" style="display:none">${idx+1<total?'Next':'Results'}</button>
  `;
  document.querySelectorAll('.opt').forEach(b=>{
    b.addEventListener('click',()=>answer(+b.dataset.i,q.a));
  });
  document.getElementById('nextBtn').addEventListener('click',next);
}

function answer(chosen,correct){
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    if(+b.dataset.i===correct)b.classList.add('correct');
    else if(+b.dataset.i===chosen)b.classList.add('wrong');
  });
  if(chosen===correct)score++;
  document.getElementById('nextBtn').style.display='inline-block';
}

function next(){idx++;idx<total?showQuestion():showResult();}

function showResult(){
  const pct=Math.round(score/total*100);
  const grade=pct>=90?'Excellent!':pct>=70?'Great!':pct>=50?'Not bad!':'Keep practicing!';
  document.getElementById('wrap').innerHTML=`
    <div class="result-card">
      <h2>${grade}</h2>
      <div class="sc">${score}/${total}</div>
      <p>${pct}% correct</p>
      <button class="play-btn" onclick="startGame()">Play Again</button>
    </div>
  `;
}

startGame();
</script>
</body>
</html>
